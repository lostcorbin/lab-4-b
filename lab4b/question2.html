
<!DOCTYPE html>
<html>
<head>
    <title>Question 2 - Number Validation</title>
</head>
<body>

    <h2>Number Validation</h2>

    <p>Enter a number to check whether it is lower or higher than 10:</p>

    <input type="text" id="userInput" placeholder="Enter a number">

    <button onclick="checkInput()">Check</button>

    <script>
        function checkInput() {

            // Get the value entered by the user
            let number = document.getElementById("userInput").value;

            // Check whether the input is a valid number
            if (number.trim() === "" || isNaN(number)) {

                alert("Please insert a number!");

            }

            // Check whether the number is lower than 10
            else if (Number(number) < 10) {

                alert("The number is lower than 10");

            }

            // Otherwise, display higher than 10
            else {

                alert("The number is higher than 10");

            }
        }
    </script>

</body>
</html>
