
<!DOCTYPE html>
<html>
<head>
    <title>Question 3 - For Loop</title>
</head>
<body>

    <h2>JavaScript For Loop</h2>

    <p id="demo"></p>

    <script>

        // Declare an empty text variable
        let text = "";

        // Use for loop to display numbers from 1 to 5
        for (let i = 1; i <= 5; i++) {

            text += "The number is " + i + "<br>";

        }

        // Display the output on the webpage
        document.getElementById("demo").innerHTML = text;

    </script>

</body>
</html>
